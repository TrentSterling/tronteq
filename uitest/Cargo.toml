[package]
name = "tronteq-uitest"
version.workspace = true
edition.workspace = true

# Headless UI snapshot harness. Separate crate for historical organization (GUI
# used to require admin manifest; asInvoker since v0.9.0). This crate has no manifest,
# so `cargo run -p tronteq-uitest` and `cargo test -p tronteq-uitest` run anywhere.

[[bin]]
name = "uishot"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true, features = ["glow"] }
egui = { workspace = true }
egui_kittest = { version = "0.33", features = ["snapshot", "wgpu"] }
image = "0.25"
serde = { workspace = true }
serde_json = { workspace = true }
tronteq-shared = { path = "../shared" }
