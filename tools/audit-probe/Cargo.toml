[package]
name = "tronteq-audit-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
eframe = { version = "=0.33.3", features = ["glow"] }
egui = "=0.33.3"
tronteq-shared = { path = "../../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rustfft = "6"
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading"] }
