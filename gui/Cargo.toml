[package]
name = "tronteq"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tronteq"
path = "src/main.rs"

[dependencies]
tronteq-shared = { path = "../shared" }
eframe = { workspace = true, features = ["glow"] }
egui = { workspace = true }
anyhow = { workspace = true }
windows = { workspace = true }
tray-icon = "0.19"
raw-window-handle = "0.6"
rustfft = "6"
serde = { workspace = true }
serde_json = { workspace = true }
# Self-screenshot PNG encode (harness pipe; PNG only, no default features).
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
# Embeds the asInvoker manifest (Medium integrity) + the .exe icon (Trent's face).
# APO install/device work delegated to tronteq-cli elevated on demand (privilege separation).
winresource = "0.1"
